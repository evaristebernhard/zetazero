name = "zetazero"
version = "0.1.0"
defaultTargets = ["ZetaZero"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[lean_lib]]
name = "ZetaZero"
moreLeanArgs = ["-DwarningAsError=true"]

# Local reference formalization cloned into this workspace.  Exposing it as a
# second source-root lets ZetaZero reuse its mature rectangle residue / zero-count
# machinery against the same Mathlib revision as the main project.
[[lean_lib]]
name = "Zeta23"
srcDir = "zeta-23-lean"
# Zeta23 is an external reference library.  Expose only the modules imported by
# ZetaZero so project builds and Blueprint declaration checks do not enumerate
# or compile the reference project's headline root (and its unrelated theorem
# branches).
roots = [
  "Zeta23.Analytic.RectangleLogDeriv",
  "Zeta23.Chebyshev",
  "Zeta23.FromPNTPlus.Mertens",
  "Zeta23.FromPNTPlus.ZetaBounds",
  "Zeta23.XiPrime.Coeff.Basic",
  "Zeta23.XiPrime.Coeff.PowerSums",
  "Zeta23.XiPrime.Hardy.Basic",
  "Zeta23.XiPrime.Hardy.Count",
  "Zeta23.XiPrime.Hardy.ZFunction",
  "Zeta23.XiPrime.Hardy.ZeroFree"
]
